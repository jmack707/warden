services:
  openbao:
    image: quay.io/openbao/openbao:latest
    container_name: openbao
    cap_add: ["IPC_LOCK"]
    ports: ["8200:8200"]
    environment:
      BAO_DEV_ROOT_TOKEN_ID: "root"          # dev mode: PoC ONLY
      BAO_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    command: server -dev -config=/warden/openbao.hcl   # -config adds the declarative file-audit device (2.x requirement)
    volumes:
      - ./openbao:/warden:ro                    # config LDIFs/policy for `bao write ...=@file` (NOT /openbao — reserved by the image)

  openldap:
    image: osixia/openldap:1.5.0
    container_name: openldap
    hostname: openldap.warden.lab
    ports: ["389:389", "636:636"]
    environment:
      LDAP_ORGANISATION: "Warden Lab"
      LDAP_DOMAIN: "warden.lab"
      LDAP_ADMIN_PASSWORD: "${LDAP_ADMIN_PW}"
      LDAP_TLS: "true"
      LDAP_TLS_CRT_FILENAME: "ldap.crt"
      LDAP_TLS_KEY_FILENAME: "ldap.key"
      LDAP_TLS_CA_CRT_FILENAME: "ca.crt"
      LDAP_TLS_VERIFY_CLIENT: "never"
    volumes:
      - ./certs:/container/service/slapd/assets/certs      # NOT :ro — osixia chowns this dir on startup
      - ldapdata:/var/lib/ldap
      - ldapconf:/etc/ldap/slapd.d

volumes:
  ldapdata:
  ldapconf:
